<!doctype html>
<html lang="en" class="scroll-smooth bg-slate-900">
  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tagnon Okoumassoun — MS in Robotics and Autonomous Systems. Multi-robot coordination, joint prediction and planning, and multi-agent reinforcement learning."
    />
    <title>Tagnon Okoumassoun</title>

    <!-- GitHub Pages SPA redirect decode: restores the real path that 404.html
         re-encoded into a query string, before React Router mounts. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
  </head>
  <body
    class="bg-slate-900 leading-relaxed text-slate-400 antialiased selection:bg-white selection:text-slate-800"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
